name: tag

on:
  push:
    branches: [main]
    paths: ['cdksopssecrets/version']

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Tag the merged bindings
        run: |
          tag="cdksopssecrets/v$(cat cdksopssecrets/version)"
          git ls-remote --exit-code --tags origin "$tag" && echo "$tag exists" && exit 0
          git tag "$tag"
          git push origin "$tag"
