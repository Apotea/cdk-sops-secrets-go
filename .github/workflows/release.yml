name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: cdk-sops-secrets version on npm to generate from
        required: true
        default: 2.8.5

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version }}
      JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: '1'
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'

      - name: Fetch published package
        run: |
          npm pack "cdk-sops-secrets@${VERSION}"
          tar xzf "cdk-sops-secrets-${VERSION}.tgz"

      - name: Install peer deps
        working-directory: package
        run: | # zizmor: ignore[adhoc-packages] resolves the newest peer deps in upstream's range, as the README states
          npm install --no-audit --no-fund $(node -p '
            Object.entries(require("./package.json").peerDependencies)
              .map(([name, range]) => `${name}@${range}`)
              .join(" ")
          ')

      - name: Add the Go target
        working-directory: package
        run: |
          node -e '
            const fs = require("fs");
            const go = { moduleName: "github.com/Apotea/cdk-sops-secrets-go" };
            const a = JSON.parse(fs.readFileSync(".jsii", "utf8"));
            a.targets.go = go;
            fs.writeFileSync(".jsii", JSON.stringify(a));
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.jsii.targets.go = go;
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2));
          '

      - name: Generate bindings
        working-directory: package
        run: npx jsii-pacmak@1.140.0 --target=go

      - name: Resolve dependencies
        working-directory: package/dist/go/cdksopssecrets
        run: go mod tidy

      - name: Synth a stack through the bindings
        working-directory: testdata
        run: |
          go mod edit -replace github.com/Apotea/cdk-sops-secrets-go/cdksopssecrets/v2=../package/dist/go/cdksopssecrets
          go mod tidy
          go run .
          test -f cdk.out/SmokeStack.template.json

      - name: Commit, tag and open the pull request
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          rm -rf cdksopssecrets
          cp -r package/dist/go/cdksopssecrets cdksopssecrets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/${VERSION}"
          git add -A cdksopssecrets
          if git diff --cached --quiet; then
            echo "bindings already current"
            exit 0
          fi
          git commit -m "Generate bindings for cdk-sops-secrets ${VERSION}"
          gh auth setup-git
          git tag "cdksopssecrets/v${VERSION}"
          git push -f origin "release/${VERSION}"
          git push origin "cdksopssecrets/v${VERSION}"
          gh pr create --base main --head "release/${VERSION}" \
            --title "Generate bindings for cdk-sops-secrets ${VERSION}" \
            --body "Generated from \`cdk-sops-secrets@${VERSION}\` on npm, compiled, and verified by synthesizing a stack through the result. Tagged \`cdksopssecrets/v${VERSION}\`."
