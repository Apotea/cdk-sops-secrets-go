name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: cdk-sops-secrets version on npm to generate from
        required: true
        default: 2.8.5

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: '1'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Fetch published package
        run: |
          npm pack "cdk-sops-secrets@${VERSION}"
          tar xzf "cdk-sops-secrets-${VERSION}.tgz"

      - name: Install peer deps at their floor
        working-directory: package
        # Generating against the lowest supported CDK keeps the module's floor low;
        # Go resolves to the maximum across a build, so consumers are never held back.
        # cloud-assembly-schema is not resolvable transitively on older CDK lines.
        run: |
          npm install --no-save semver
          floor() { node -p "require('semver').minVersion(require('./package.json').peerDependencies['$1']).version"; }
          npm install --no-audit --no-fund \
            "aws-cdk-lib@$(floor aws-cdk-lib)" \
            "constructs@$(floor constructs)" \
            @aws-cdk/cloud-assembly-schema

      - name: Add the Go target
        working-directory: package
        run: |
          node -e '
            const fs = require("fs");
            const go = { moduleName: "github.com/Apotea/cdk-sops-secrets-go" };
            const a = JSON.parse(fs.readFileSync(".jsii", "utf8"));
            a.targets.go = go;
            fs.writeFileSync(".jsii", JSON.stringify(a));
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.jsii.targets.go = go;
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2));
          '

      - name: Generate bindings
        working-directory: package
        run: npx jsii-pacmak@1.140.0 --target=go

      - name: Resolve dependencies
        working-directory: package/dist/go/cdksopssecrets
        run: go mod tidy

      - name: Verify
        working-directory: package/dist/go/cdksopssecrets
        run: |
          go build ./...
          go vet ./...

      - name: Synth a stack through the bindings
        working-directory: testdata
        run: |
          go mod edit -replace github.com/Apotea/cdk-sops-secrets-go/cdksopssecrets/v2=../package/dist/go/cdksopssecrets
          go mod tidy
          go run .
          test -f cdk.out/SmokeStack.template.json

      - name: Commit and tag
        run: |
          rm -rf cdksopssecrets
          cp -r package/dist/go/cdksopssecrets cdksopssecrets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cdksopssecrets
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Generate bindings for cdk-sops-secrets ${VERSION}"
          git tag "cdksopssecrets/v${VERSION}"
          git push origin HEAD "cdksopssecrets/v${VERSION}"
